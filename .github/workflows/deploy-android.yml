name: Deploy Android to Google Play

on:
  push:
    tags:
      - 'v*'   # Ex: v1.0.1, v2.0.0 — dispara somente em releases

jobs:
  # ─────────────────────────────────────────
  # 1. Build & Sign the Android App Bundle
  # ─────────────────────────────────────────
  build-android:
    name: Build App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Restore keystore from secret
        # Decodifica o keystore (base64) que está no GitHub Secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > mobile/android/upload-keystore.jks

      - name: Create key.properties
        # Cria o arquivo key.properties dinamicamente usando os secrets
        run: |
          cat > mobile/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release App Bundle
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # ─────────────────────────────────────────
  # 2. Upload to Google Play (Internal Track)
  # ─────────────────────────────────────────
  deploy-to-play-store:
    name: Upload to Google Play Store
    runs-on: ubuntu-latest
    needs: [build-android]

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.c1c3ru.vaidarjogo
          releaseFiles: app-release.aab
          track: internal          # Mude para "production" quando quiser lançar publicamente
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew  # Opcional: pasta com notas da versão
